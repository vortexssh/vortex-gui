name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend deps
        run: npm ci

      - name: Build & upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: 1
        with:
          # On tag push uses the tag; otherwise tauri-action substitutes __VERSION__ from config.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: 'Vortex GUI v__VERSION__'
          releaseBody: |
            Desktop client for VortexSSH.

            **Install**
            - Linux / macOS:
              `curl -fsSL https://raw.githubusercontent.com/vortexssh/vortex-gui/master/scripts/install.sh | bash`
            - Windows (PowerShell):
              `irm https://raw.githubusercontent.com/vortexssh/vortex-gui/master/scripts/install.ps1 | iex`

            Secrets stay on-device. Never POST SSH passwords/keys to Core.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Unbundle libwayland from AppImage
        if: matrix.platform == 'ubuntu-22.04' && startsWith(github.ref, 'refs/tags/')
        run: |
          chmod +x scripts/appimage-unbundle-wayland.sh
          scripts/appimage-unbundle-wayland.sh src-tauri/target/release/bundle/appimage/*.AppImage
          gh release upload "${GITHUB_REF#refs/tags/}" src-tauri/target/release/bundle/appimage/*.AppImage --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
